<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div>
    <div class="d-flex justify-content-between">
        <h3 class="m-3">Мои заявки</h3>
    </div>
    <table id="applicationTable" border="1" style="margin-top:10px; border-collapse: collapse; width: 100%;">
        <thead>
        <tr>
            <th>ID</th>
            <th>Текст заявки</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
    const apiUrl = "http://localhost:8080/api";

    const token = localStorage.getItem("token");

    loadApplications();

    async function loadApplications(){
        try {
            if (!token){
                alert("Токен не найден! Пожалуйста, войдите заново.");
                window.location.href = "/htmls/login.html";
            }
            // const response = await fetch(`${apiUrl}/application/get`);
            const response = await fetch(`${apiUrl}/application/get`, {
                method: "GET",
                headers: {
                    "Content-Type":"application/json",
                    "Authorization":"Bearer " + token
                }
            });

            const applications = await response.json();

            const tbody = document.querySelector('#applicationTable tbody');
            tbody.innerHTML = ''; // очищаем таблицу перед добавлением новых данных

            counter = 0;
            applications.forEach(app => {
                const row = document.createElement('tr');
                counter++;
                const idCell = document.createElement('td');
                idCell.textContent = counter;
                row.appendChild(idCell);

                const textCell = document.createElement('td');
                textCell.textContent = app.text;
                row.appendChild(textCell);

                const actionCell = document.createElement('td');

                const updateBtn = document.createElement('button');
                updateBtn.textContent = "Update";
                updateBtn.onclick = () => updateApplication(app.id);

                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = "Delete";
                deleteBtn.onclick = () => deleteApplication(app.id);

                actionCell.appendChild(updateBtn);
                actionCell.appendChild(deleteBtn);
                row.appendChild(actionCell);

                tbody.appendChild(row);
            });

        } catch (error) {
            alert("Ошибка при загрузке заявок");
            console.error(error);
        }
    }

    async function updateApplication(id) {
        const newText = prompt("Введите новый текст заявки:");
        if (!newText) return;

        try {
            const response = await fetch(`${apiUrl}/application/update`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization":token
                },
                body: JSON.stringify({ id:id , text: newText })
            });

            if (response.ok) {
                alert("Заявка обновлена!");
                document.getElementById('getUserApplications').click(); // обновляем таблицу
            } else {
                alert("Ошибка при обновлении");
            }
        } catch (error) {
            alert("Ошибка сети");
            console.error(error);
        }
    }

    async function deleteApplication(id) {
        // if (!confirm("Удалить эту заявку?")) return;

        try {
            const response = await fetch(`${apiUrl}/application/delete/${id}`, {
                method: "DELETE",
                headers: {
                    "Authorization":token
                }
            });

            if (response.ok) {
                alert("Заявка удалена!");
                document.getElementById('getUserApplications').click(); // обновляем таблицу
            } else {
                alert("Ошибка при удалении");
            }
        } catch (error) {
            alert("Ошибка сети");
            console.error(error);
        }
    }

</script>

</body>
</html>
