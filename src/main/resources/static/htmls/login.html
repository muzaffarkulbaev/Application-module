<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
    body {
        background: linear-gradient(135deg, #74ebd5, #ACB6E5);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Segoe UI', sans-serif;
    }
    .login-card {
        background: #fff;
        padding: 2rem 2.5rem;
        border-radius: 1rem;
        box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        width: 100%;
        max-width: 380px;
    }
    .login-card h2 {
        text-align: center;
        margin-bottom: 1.5rem;
        color: #333;
    }
    .btn-dark {
        width: 100%;
        margin-top: 1rem;
    }
</style>
</head>
<body>

<div class="login-card">
    <h2>Вход</h2>

    <div class="mb-3">
        <label for="email" class="form-label">Email:</label>
        <input type="email" class="form-control" id="email" placeholder="Введите email">
    </div>

    <div class="mb-3">
        <label for="password" class="form-label">Пароль:</label>
        <input type="password" class="form-control" id="password" placeholder="Введите пароль">
    </div>

    <button class="btn btn-dark" id="loginBtn">Войти</button>

    <div class="mt-3 text-center">
        <small>Нет аккаунта? <a href="register.html">Зарегистрироваться</a></small>
    </div>
</div>

<script>
    const apiUrl = "http://localhost:8080/api";

    document.getElementById('loginBtn').addEventListener('click', async () => {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!email) {
            alert("Введите email!");
            return;
        }
        if (!password) {
            alert("Введите пароль!");
            return;
        }

        try {
            const response = await fetch(`${apiUrl}/auth/login`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (response.ok) {
                const token = data.token;
                const expireTime = data.expiresAt;
                const role = data.role;

                localStorage.setItem("token", token);
                localStorage.setItem("expiresAt", expireTime);
                localStorage.setItem("role", role);

                alert("Вход выполнен успешно!");
                if(role === 'ADMIN'){
                    window.location.href = "admin.html";
                }else if(role === 'MANAGER'){
                    window.location.href = "manager.html";
                }else {
                    window.location.href = "home.html";
                }
            } else {
                alert(data.message || "Неверный email или пароль");
            }
        } catch (error) {
            alert("Ошибка соединения с сервером");
        }
    });
</script>

</body>
</html>
